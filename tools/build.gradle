// Offline rendering tools. Runs on any JDK, no game required.

dependencies {
    implementation project(':core')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

/**
 * Renders every documentation screenshot through the real widget code.
 *
 * CI runs this on each push, so the images in README cannot drift away from what
 * the mod actually draws.
 */
tasks.register('screenshots', JavaExec) {
    group = 'documentation'
    description = 'Render docs/screenshots/*.png using the shipping renderer.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.md3ui.tools.ScreenshotGen'
    args rootProject.file('docs/screenshots').absolutePath
    // Headless so it works on a CI runner with no display.
    systemProperty 'java.awt.headless', 'true'
}

/**
 * Exports the generated colour scheme as Figma-importable design tokens.
 */
tasks.register('designTokens', JavaExec) {
    group = 'documentation'
    description = 'Write design/*.json (W3C tokens + Figma variables).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.md3ui.tools.TokenExport'
    args rootProject.file('design').absolutePath
    systemProperty 'java.awt.headless', 'true'
}

/**
 * Draws the mod icon with the same shape solver the UI uses.
 */
tasks.register('icon', JavaExec) {
    group = 'documentation'
    description = 'Generate the 128x128 Fabric mod icon.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.md3ui.tools.IconGen'
    args rootProject.file('mod/src/main/resources/assets/md3ui').absolutePath
    systemProperty 'java.awt.headless', 'true'
}
