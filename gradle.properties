# Loom needs headroom when remapping Minecraft.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Loom is not configuration-cache compatible yet.
# https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Toolchain: matches the Fabric template for 1.21.4 through 1.21.11.
loom_version=1.17.20
loader_version=0.19.3
