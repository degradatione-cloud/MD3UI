plugins {
    // The current Fabric plugin id. The old `fabric-loom` coordinates are
    // superseded; `fabric-loom-remap` is what the official template uses for
    // 1.21.4 onward, and older Loom releases cannot read Fabric API artefacts
    // built with 1.13+.
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

// Target version is injected by CI so one source tree builds all eight jars:
//   ./gradlew :mod:build -Pmc=1.21.11
// Defaults keep a plain `./gradlew :mod:build` working for contributors.
def mcVersion = project.findProperty('mc') ?: '1.21.11'
def versions = new groovy.json.JsonSlurper().parse(
        rootProject.file('versions.json')) as Map

if (!versions.containsKey(mcVersion)) {
    throw new GradleException("Unsupported -Pmc=${mcVersion}. " +
            "Known: ${versions.keySet().join(', ')}")
}
def target = versions[mcVersion]

base {
    archivesName = 'md3ui'
}
version = "${rootProject.version}+${mcVersion}"

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"

    // Official Mojang mappings, not Yarn, and this is deliberate: the handful of
    // API members MD3UI touches (GuiGraphics.fill/drawString/enableScissor,
    // AbstractWidget.getX/getWidth/visible) keep identical names in official
    // mappings across 1.21.4 -> 1.21.11, whereas Yarn renames members between
    // snapshots. One source tree therefore compiles for every target with no
    // per-version source sets.
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"

    // Only the modules actually used, not the whole API surface.
    modImplementation fabricApi.module('fabric-screen-api-v1', target.fapi)
    modImplementation fabricApi.module('fabric-resource-loader-v0', target.fapi)

    implementation project(':core')
    // core is pure Java with no Minecraft references, so bundling is safe.
    include project(':core')
}

loom {
    runConfigs.configureEach {
        ideConfigGenerated = true
    }
    // Access wideners are intentionally absent: nothing private is touched.
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcVersion', mcVersion

    filesMatching('fabric.mod.json') {
        expand(
                'version': project.version,
                'mcDep': target.dep,
                'loaderDep': '>=0.16.0'
        )
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_md3ui" }
    }
    manifest {
        attributes(
                'Implementation-Title': 'MD3UI',
                'Implementation-Version': project.version,
                'Built-For-Minecraft': mcVersion
        )
    }
}
